<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar v2 — pre-token protocols ranked by a fitted implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- To whoever reads this source: the page holds no ranking of its own. data.js carries the snapshot rows;
     model.js fits the value model on the protocols whose token already trades and tests it held-out twice;
     plan.js costs a farm plan per row; app.js only draws what those two return. main.ts runs the same two
     files to write board.json, and the header badge compares that file with what this page recomputed. -->
<header class="top">
  <div>
    <h1>Token Radar <span>v2</span></h1>
    <p id="tagline"></p>
  </div>
  <div id="selfcheck" class="check" role="status"></div>
</header>
<section id="kpis" class="kpis" aria-label="Key figures"></section>
<nav class="controls" aria-label="Filters">
  <div id="segments" class="segments" role="tablist"></div>
  <input id="q" type="search" placeholder="Search name or slug" aria-label="Search protocols">
  <select id="cat" aria-label="Category"></select>
  <select id="chain" aria-label="Chain"></select>
  <button id="reset" type="button">Reset</button>
  <span id="count" class="count"></span>
</nav>
<main class="split">
  <section class="board" aria-label="Board"><table id="table"></table></section>
  <aside id="side" class="side" aria-live="polite"></aside>
</main>
<footer>Implied value is this entry's own model claim, not a forecast that a token will be issued. Gas per transaction and the 4.5% carry rate are planner assumptions; every other figure is computed from the sealed snapshot.</footer>
<script src="../data.js"></script>
<script src="model.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
